ingress:
  cert: "distributorwildcard"
  # nginx.org/ssl-redirect. "True" for targets whose app emits absolute http redirects
  # behind the TLS-terminating ingress (avoids http/https duplicate entrypoints).
  sslRedirect: "False"
# Extra pod annotations, e.g. karpenter.sh/do-not-disrupt for e2e targets.
podAnnotations: {}

application:
  image: "hightechsec/docker-dvwa"
  port: 80
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 500Mi
    limits:
      memory: 1024Mi

global:
  repeaterIDs: null
  token: null
  cluster: null
  timeout: "30000"
  repeaterImageTag: null
