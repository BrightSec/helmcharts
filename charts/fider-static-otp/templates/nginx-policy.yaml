{{- if and .Values.ingress.url .Values.ingress.rateLimiting.enabled }}
# Connection limit per client IP for F5 NGINX Ingress Controller,
# attached to the Ingresses via nginx.org/policies.
apiVersion: k8s.nginx.org/v1
kind: Policy
metadata:
  name: {{ include "fider-static-otp.fullname" . }}-connection-limit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fider-static-otp.labels" . | nindent 4 }}
spec:
  connectionLimit:
    connections: {{ int .Values.ingress.rateLimiting.connections }}
    rejectCode: 429
{{- end }}
