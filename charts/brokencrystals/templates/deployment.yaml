{{- $repeaterIDs := list }}
{{- if and (hasKey .Values "global") .Values.global.repeaterIDs }}
  {{- $repeaterIDs = .Values.global.repeaterIDs }}
{{- else if kindIs "slice" .Values.repeaterID }}
  {{- $repeaterIDs = .Values.repeaterID }}
{{- else if .Values.repeaterID }}
  {{- $repeaterIDs = list .Values.repeaterID }}
{{- end }}
{{- $token := (or (and (hasKey .Values "global") .Values.global.token) .Values.token) }}
{{- $cluster := (or (and (hasKey .Values "global") .Values.global.cluster) .Values.cluster) }}
{{- $timeout := (or (and (hasKey .Values "global") .Values.global.timeout) .Values.timeout "30000") }}
{{- $repeaterImageTag := (or (and (hasKey .Values "global") .Values.global.repeaterImageTag) .Values.repeaterImageTag "latest") }}
{{- $repeaters := list }}
{{- if and (hasKey .Values "global") .Values.global.repeaters }}
  {{- $repeaters = .Values.global.repeaters }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: brokencrystals
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app: {{ .Release.Name }}
        app.kubernetes.io/name: brokencrystals
    spec:
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "postgres"
            - "keycloak-postgres"
            - "keycloak"
            - "nodejs"
            - "proxy"
            - "repeater"
            - "db"
            - "ollama"
            - "grpc"
            - "brokencrystals.local"
            - "mailcatcher"
      containers:
        - name: postgres
          image: postgres
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 60
            periodSeconds: 30
          env:
            - name: POSTGRES_DB
              value: "bc"
            - name: POSTGRES_USER
              value: "bc"
            - name: POSTGRES_PASSWORD
              value: "bc"
          resources:
            requests:
              cpu: 200m
              memory: 100Mi
          volumeMounts:
          - name: {{ include "brokencrystals.fullname" . }}-postgres
            mountPath: /docker-entrypoint-initdb.d/pg.sql
            subPath: pg.sql
            readOnly: true

        - name: keycloak-postgres
          image: postgres:12.2-alpine
          ports:
            - containerPort: 5433
          livenessProbe:
            tcpSocket:
              port: 5433
            initialDelaySeconds: 60
            periodSeconds: 30
          env:
            - name: POSTGRES_DB
              value: "keycloak"
            - name: POSTGRES_USER
              value: "keycloak"
            - name: POSTGRES_PASSWORD
              value: "password"
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
          volumeMounts:
          - name: {{ include "brokencrystals.fullname" . }}-kc-db
            mountPath: /usr/local/share/postgresql/postgresql.conf.sample
            subPath: postgresql.conf.sample
            readOnly: true

        - name: keycloak
          image: quay.io/keycloak/keycloak:16.1.1
          resources:
            requests:
              cpu: 200m
              memory: 500Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
          env:
            - name: DB_VENDOR
              value: "POSTGRES"
            - name: DB_ADDR
              value: "keycloak-postgres"
            - name: DB_PORT
              value: "5433"
            - name: DB_DATABASE
              value: "keycloak"
            - name: DB_SCHEMA
              value: "public"
            - name: DB_PASSWORD
              value: "password"
            - name: KEYCLOAK_USER
              value: "admin"
            - name: KEYCLOAK_PASSWORD
              value: "Pa55w0rd"
            - name: KEYCLOAK_IMPORT
              value: "/opt/jboss/keycloak/imports/realm-export.json -Dkeycloak.profile.feature.upload_scripts=enabled"
            - name: PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: KEYCLOAK_FRONTEND_URL
              value: "https://auth{{ .Values.ingress.authlevel }}{{ .Values.ingress.url }}/auth/"
          volumeMounts:
          - name: {{ include "brokencrystals.fullname" . }}-keycloak
            mountPath: /opt/jboss/keycloak/imports/realm-export.json
            subPath: realm-export.json
            readOnly: true

        - name: nodejs
          image: brightsec/brokencrystals:{{ .Values.images.main }}
          ports:
            - containerPort: 3000
            - containerPort: 5000
          env:
            - name: URL
              value: "https://{{ .Values.ingress.url }}"
            - name: DATABASE_HOST
              value: "postgres"
            - name: DATABASE_SCHEMA
              value: "bc"
            - name: DATABASE_USER
              value: "bc"
            - name: DATABASE_PASSWORD
              value: "bc"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_DEBUG
              value: "true"
            - name: FASTIFY_LOG_LEVEL
              value: "info"
            - name: AWS_BUCKET
              value: "https://neuralegion-open-bucket.s3.amazonaws.com"
            - name: GOOGLE_MAPS_API
              value: "AIzaSyD2wIxpYCuNI0Zjt8kChs2hLTS5abVQfRQ"
            - name: JWT_PRIVATE_KEY_LOCATION
              value: "config/keys/jwtRS256.key"
            - name: JWT_PUBLIC_KEY_LOCATION
              value: "config/keys/jwtRS256.key.pub.pem"
            - name: JWT_SECRET_KEY
              value: "1234"
            - name: JWK_PRIVATE_KEY_LOCATION
              value: "config/keys/jwk.key.pem"
            - name: JWK_PUBLIC_KEY_LOCATION
              value: "config/keys/jwk.pub.key.pem"
            - name: JWK_PUBLIC_JSON
              value: "config/keys/jwk.pub.json"
            - name: JKU_URL
              value: "https://raw.githubusercontent.com/brightsec/brokencrystals/stable/config/keys/jku.json"
            - name: X5U_URL
              value: "https://raw.githubusercontent.com/brightsec/brokencrystals/stable/config/keys/x509.crt"
            - name: KEYCLOAK_SERVER_URI
              value: "http://keycloak:8080/auth"
            - name: GRPC_WEB_PROXY_URL
              value: "http://grpc:8081"
            {{- if .Values.useOllama }}
            - name: OLLAMA_SERVICE_URL
              value: "http://ollama:11434"
            {{- end }}
            {{ $configmap := (lookup "v1" "ConfigMap" .Release.Namespace .Values.clusterConfigMap) }}
            {{- if $configmap}}
          envFrom:
            - configMapRef:
                name: {{ $configmap.metadata.name }}
            {{- end}}
          resources:
            requests:
              cpu: 900m
              memory: 1024Mi
            limits:
              memory: 15G
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            failureThreshold: 12
            periodSeconds: 10

        - name: grpc
          image: webis/grpcwebproxy:0.14.0
          command:
            - grpcwebproxy
            - '--backend_addr=nodejs:5000'
            - '--run_tls_server=false'
            - '--run_http_server=true'
            - '--server_http_debug_port=8081'
            - '--allow_all_origins'
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 50Mi

        {{- if .Values.useMailcatcher }}
        - name: mailcatcher
          image: sj26/mailcatcher
        {{- end }}

        {{- if .Values.useOllama }}
        - name: ollama
          image: brightsec/brokencrystals-ollama:smollm135m
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "100m"
              memory: "350Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 11434
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 11434
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
        {{- end }}

        {{- if gt (len $repeaters) 0 }}
        {{- range $index, $repeater := $repeaters }}
        - name: repeater-{{ $index }}
          image: brightsec/cli:{{ $repeaterImageTag }}
          command: ["bright-cli", "repeater"]
          args:
            - "--token=$(TOKEN)"
            - "--id=$(REPEATER_ID)"
            - "--cluster=$(CLUSTER)"
            - "--timeout=$(TIMEOUT)"
            - "--log-level=verbose"
          resources:
            requests:
              cpu: 200m
              memory: 100Mi
          env:
            - name: REPEATER_ID
              value: "{{ $repeater.id }}"
            - name: TOKEN
              value: "{{ $repeater.token }}"
            - name: CLUSTER
              value: "{{ $cluster }}"
            - name: TIMEOUT
              value: "{{ $timeout }}"
        {{- end }}
        {{- else if and $token $cluster (gt (len $repeaterIDs) 0) }}
        {{- range $index, $repeaterID := $repeaterIDs }}
        - name: repeater-{{ $index }}
          image: brightsec/cli:{{ $repeaterImageTag }}
          command: ["bright-cli", "repeater"]
          args:
            - "--token=$(TOKEN)"
            - "--id=$(REPEATER_ID)"
            - "--cluster=$(CLUSTER)"
            - "--timeout=$(TIMEOUT)"
            - "--log-level=verbose"
          resources:
            requests:
              cpu: 200m
              memory: 100Mi
          env:
            - name: REPEATER_ID
              value: "{{ $repeaterID }}"
            - name: TOKEN
              value: "{{ $token }}"
            - name: CLUSTER
              value: "{{ $cluster }}"
            - name: TIMEOUT
              value: "{{ $timeout }}"
        {{- end }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
      - name: {{ include "brokencrystals.fullname" . }}-postgres
        configMap:
          name: {{ include "brokencrystals.fullname" . }}-postgres
      - name: {{ include "brokencrystals.fullname" . }}-kc-db
        configMap:
          name: {{ include "brokencrystals.fullname" . }}-kc-db
      - name: {{ include "brokencrystals.fullname" . }}-keycloak
        configMap:
          name: {{ include "brokencrystals.fullname" . }}-keycloak
