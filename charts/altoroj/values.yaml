simple-service:
  ingress:
    # Apache/Tomcat behind TLS termination emits absolute http redirects
    sslRedirect: "True"
  podAnnotations:
    # Keep Karpenter consolidation from evicting the target mid-test (IR-835)
    karpenter.sh/do-not-disrupt: "true"
  application:
    image: "brightsec/altoroj:3.5-dev"
    port: 8080
    env:
      foo: bar
    resources:
      requests:
        cpu: 50m
        memory: 750Mi
        ephemeral-storage: "4Gi"
      limits:
        memory: 1024Mi
    livenessProbe:
      httpGet:
        path: /
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 120
      periodSeconds: 30
